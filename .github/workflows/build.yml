name: Build GitDrop APK

on:
  push:
    branches: [ "main", "release/**" ]
    paths-ignore: [ '**.md', '.github/**' ]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build GitDrop APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. JDK 17 ─────────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Gradle cache ───────────────────────────────────────────────────────
      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-

      # ── 4. Signing keystore ───────────────────────────────────────────────────
      - name: Restore or generate signing keystore
        run: |
          mkdir -p signing
          if [ -f signing/signing-key.jks ]; then
            echo "Using committed keystore: $(wc -c < signing/signing-key.jks) bytes"
          elif [ -n "${{ secrets.SIGNING_KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.SIGNING_KEYSTORE_B64 }}" | base64 -d > signing/signing-key.jks
            echo "Keystore from secret: $(wc -c < signing/signing-key.jks) bytes"
          else
            echo "::error::No permanent signing keystore found (missing signing/signing-key.jks and SIGNING_KEYSTORE_B64 secret). Refusing to generate a throwaway key — that would silently break updates for everyone on a previous install. Restore signing/signing-key.jks or set the SIGNING_KEYSTORE_B64 secret, then rerun."
            exit 1
          fi

      # ── 5. local.properties ───────────────────────────────────────────────────
      - name: Create local.properties
        run: |
          printf 'signing.storeFile=signing/signing-key.jks\nsigning.storePassword=oeDPihCMSFy0gHW1GI\nsigning.keyAlias=gitdrop\nsigning.keyPassword=oeDPihCMSFy0gHW1GI\n' \
            > local.properties

      # ── 6. Gradle wrapper (generated if the repo does not carry one) ──────────
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-disabled: true

      - name: Generate Gradle wrapper if missing
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ] || [ ! -f gradlew ]; then
            TMP=$(mktemp -d)
            (cd "$TMP" && gradle wrapper --gradle-version 8.10.2 --no-daemon)
            mkdir -p gradle
            cp -r "$TMP/gradle/wrapper" gradle/
            cp "$TMP/gradlew" "$TMP/gradlew.bat" .
            echo "Gradle wrapper generated"
          fi
          chmod +x ./gradlew

      # ── 7. Android SDK licences ───────────────────────────────────────────────
      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # ── 8. Auto version bump ──────────────────────────────────────────────────
      - name: Bump version
        run: |
          BUILD=${{ github.run_number }}
          VER_NAME="1.0.${BUILD}"
          sed -i "s/versionCode = [0-9]*/versionCode = ${BUILD}/" app/build.gradle.kts
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"${VER_NAME}\"/" app/build.gradle.kts
          echo "versionCode → ${BUILD}"
          echo "versionName → ${VER_NAME}"

      # ── 9. Build Release APK ──────────────────────────────────────────────────
      - name: Assemble Release APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      # ── 10. Version info ──────────────────────────────────────────────────────
      - name: Get version info
        id: version
        run: |
          VER=$(grep 'versionName' app/build.gradle.kts | grep -oP '"[^"]+"' | tr -d '"' | head -1)
          echo "name=$VER"                      >> $GITHUB_OUTPUT
          echo "apk_name=GitDrop-v${VER}.apk"   >> $GITHUB_OUTPUT
          echo "Version: $VER"

      # ── 11. Rename APKs ───────────────────────────────────────────────────────
      - name: Rename APKs
        run: |
          VER="${{ steps.version.outputs.name }}"
          OUTDIR="app/build/outputs/apk/release"
          # Gradle splits naming: app-<abi>-release.apk  +  app-universal-release.apk
          declare -A ABI_LABELS=(
            ["armeabi-v7a"]="armv7-32bit"
            ["arm64-v8a"]="arm64-phone-64bit"
            ["x86_64"]="x86_64-emulator"
            ["universal"]="universal-all-devices"
          )
          for ABI in "${!ABI_LABELS[@]}"; do
            SRC="$OUTDIR/app-${ABI}-release.apk"
            if [ -f "$SRC" ]; then
              DEST="$OUTDIR/GitDrop-v${VER}-${ABI_LABELS[$ABI]}.apk"
              cp "$SRC" "$DEST"
              echo "Renamed: $SRC → $DEST"
            fi
          done
          echo "All APKs in $OUTDIR:"
          ls -lh "$OUTDIR"/GitDrop-*.apk

      # ── 12. Upload artifacts ──────────────────────────────────────────────────
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        continue-on-error: true          # storage quota se build block na ho
        with:
          name: GitDrop-v${{ steps.version.outputs.name }}-all-apks
          path: app/build/outputs/apk/release/GitDrop-*.apk
          retention-days: 1

      # ── 13. GitHub Release ────────────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}-build.${{ github.run_number }}
          name: "GitDrop v${{ steps.version.outputs.name }} (Build #${{ github.run_number }})"
          body: |
            ## GitDrop v${{ steps.version.outputs.name }} — Automated Release

            **Branch:** `${{ github.ref_name }}` | **Commit:** `${{ github.sha }}`
            **Package:** `com.rohan.gitdrop`

            ### APK Downloads — Pick the right one for your device

            | File | Device |
            |------|--------|
            | `GitDrop-v${{ steps.version.outputs.name }}-armv7-32bit.apk` | Older 32-bit ARM phones |
            | `GitDrop-v${{ steps.version.outputs.name }}-arm64-phone-64bit.apk` | Modern Android phones (64-bit ARM) |
            | `GitDrop-v${{ steps.version.outputs.name }}-x86_64-emulator.apk` | x86 devices, emulators |
            | `GitDrop-v${{ steps.version.outputs.name }}-universal-all-devices.apk` | All devices (larger file) |

            ### What GitDrop does
            - Pick a folder from your phone and push it to any GitHub repo you can access
            - Choose the repo and branch (or create a new branch), write the commit message, push
            - Only changed files are uploaded; optional delete of files removed locally
            - Login with a GitHub personal access token, stored encrypted in the Android Keystore

            ### Install
            1. Download the APK for your device (see table above)
            2. Enable **Install from unknown sources** in Settings
            3. Install, open **Settings → GitHub access**, paste your token
            4. Pick repo → branch → folder → commit message → **Push to GitHub**

          draft: false
          prerelease: false
          files: app/build/outputs/apk/release/GitDrop-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
